[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workflow-app"
version = "0.1.0"
description = "Workflow App — Claude Code pipeline orchestrator"
requires-python = ">=3.10,<3.14"
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "python-statemachine>=2.0.0",
    "pyte>=0.8.0",
    "pydantic>=2.5",
    "PyYAML>=6.0,<7",
    "claude-agent-sdk>=0.2.0",
    # NAO declarar `jsonschema` aqui. A dependencia entrou por causa do gate
    # de contrato da lane brainstorm e ficou morta duas vezes: o gate vive em
    # `ai-forge/scripts/validate-brainstorm-md.py`, que roda sob o python do
    # sistema e nunca ve este ambiente; e esse validador decidiu, por escrito
    # (`validate-brainstorm-md.py`, secao "VALIDACAO DE SCHEMA SEM DEPENDENCIA
    # OPCIONAL"), avaliar o subconjunto de JSON Schema com codigo proprio,
    # justamente para nao produzir veredito diferente conforme o pacote esteja
    # ou nao instalado. Nada em `src/` nem em `tests/` importa jsonschema.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "pytest-timeout>=2.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "mutmut>=2.4,<3",  # 3.x e rewrite com schema de config incompativel ([tool.mutmut] aqui usa keys 2.x)
]

[project.scripts]
workflow-app = "workflow_app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_app"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "workflow_app/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/.pytest_cache"
# Hardening T9 §7 (criterio 10) do loop 05-21-implantation-tasklist-aba-brainstorm:
# line + branch coverage combinado >=80% nos modulos do MCPPromptButton.
addopts = "--cov=workflow_app.widgets.mcp_prompt_button --cov=workflow_app.widgets.mcp_prompt_actions --cov-branch --cov-report=term-missing --cov-fail-under=80"
markers = [
    "grok_live: testes de integracao Grok que exigem credencial real (item 025). BLOCKED sem GROK_API_KEY.",
]

[tool.hatch.envs.default.scripts]
db-seed = "python3 scripts/seed.py"
db-reset = "python3 scripts/seed.py --reset"

[tool.ruff]
line-length = 100
target-version = "py310"
cache-dir = ".cache/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line too long handled by formatter

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]
cache_dir = ".cache/.mypy_cache"

[tool.mutmut]
paths_to_mutate = "src/workflow_app/"
backup = false
runner = "python -m pytest tests/ -x --timeout=30 --ignore=tests/performance -q"
tests_dir = "tests/"
# Excluir módulos UI (PySide6) — alto custo de mutação, baixo valor de lógica pura
# Focar em: domain, pipeline, sdk, core, db, history, errors
dict_synonyms = "Mutation, mutation"
